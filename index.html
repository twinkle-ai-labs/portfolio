    <!-- GA4 — **쿠키 없이** 센다. twinklelabs.kr 아래 네 집이 모두 이 방식이다.

         동의 배너를 세우지 않기로 했다. 그래서 Consent Mode v2 의 네 칸을 모두
         denied 로 못 박은 채 시작한다 — 그러면 gtag 는 쿠키를 심지 않고 저장소를
         건드리지 않는 핑만 보낸다. ePrivacy 가 동의를 요구하는 것은 「단말기의
         저장소 접근」이므로, 그 접근이 없으면 물을 것도 없다.

         대신 같은 사람의 두 번째 방문을 첫 번째와 잇지 못한다. 「사용자 수」와
         「재방문율」은 믿을 수 없는 값이 되고, 남는 것은 페이지뷰·유입 경로·나라·기기다.

         로더는 이 스크립트의 **마지막 줄에서** 우리가 단다. `<script async src>` 를
         앞에 두면 그것이 먼저 깨어나 denied 를 못 본 채 켜질 수 있다 —
         동의 기본값이 반드시 먼저다.

         `send_page_view: false` 는 그대로 둔다: 이 사이트는 문서를 새로 열지 않고
         화면만 갈아 끼우므로 페이지뷰는 AnalyticsTracker 가 경로마다 보낸다. -->
    <script>

        function gtag(){dataLayer.push(arguments);}

        gtag('consent', 'default', {
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            analytics_storage: 'denied'
        });
        gtag('set', 'ads_data_redaction', true);
        gtag('js', new Date());
        gtag('config', 'G-12M0W1PBET', { send_page_view: false });
